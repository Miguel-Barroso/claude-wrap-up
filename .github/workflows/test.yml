name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The full suite plants real watcher processes, a unix socket and a detached
  # orphan, so it is POSIX-only by design.
  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          python3 --version
          git --version
          ./plugin/skills/wrap-up/wrapup-check --version

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json \
                   plugin/hooks/hooks.json plugin/skills/wrap-up/config.example.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "ok  $f"
          done

      - name: Planted-fault tests
        run: ./plugin/skills/wrap-up/tests/run-tests

      - name: Discovery runs with no config
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/plugin/skills/wrap-up/wrapup-check --no-config --show-config
          "$GITHUB_WORKSPACE"/plugin/skills/wrap-up/wrapup-check --no-config --no-sizes \
            --state "$PWD/state.json" || test $? -eq 1
          test -f "$PWD/state.json" && echo "ok  state written to the path given"

      - name: A clean run exits 0 and says so
        run: |
          cd "$(mktemp -d)"
          printf '{"memory_dirs":[],"repos":[],"temp":{"roots":[]},"schedules":{"dirs":[],"commands":false},"processes":{"include":["^$never"]}}' > empty.json
          "$GITHUB_WORKSPACE"/plugin/skills/wrap-up/wrapup-check --config empty.json --state "$PWD/s.json" | tee out.txt
          grep -q "All clear." out.txt

  # Every platform the skill claims to support, including Windows.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cross-platform smoke test
        shell: bash
        run: python3 plugin/skills/wrap-up/tests/smoke || python plugin/skills/wrap-up/tests/smoke

      # Claude Code runs hooks and the Bash tool through Git Bash on Windows, where
      # the script's own shebang works. This proves the PowerShell/cmd path too.
      - name: Windows launcher under cmd.exe
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          plugin\skills\wrap-up\wrapup-check.cmd --version
          plugin\skills\wrap-up\wrapup-check.cmd --no-config --show-config

      - name: Windows shebang under Git Bash
        if: runner.os == 'Windows'
        shell: bash
        run: ./plugin/skills/wrap-up/wrapup-check --version
